<script type="text/babel">

          <ul>
            {navItems.map((item) => (
              <li key={item.href}>
                <a href={item.href} onClick={() => setOpen(false)}>{item.label}</a>
              </li>
            ))}
          </ul>
        </nav>
        <button
          type="button"
          className="burger"
          aria-label="Mobil menyu"
          aria-expanded={open}
          onClick={() => setOpen(!open)}
        >
          ☰
        </button>

}

/* ============ HERO ============ */

          <div className="hero-buttons">

            <a href="#contact" className="btn btn-outline">Bog'lanish</a>

        </div>
        <div className="hero-img">🏥</div>

/* ============ ABOUT ============ */
function About() {
  return (
    <section className="about" id="about">
      <div className="about-container">
        <div className="about-text">
          <h2>Biz haqimizda</h2>
          <p><strong>Rayol Med Texnika</strong> — O'zbekistondagi yetakchi tibbiy texnika yetkazib beruvchi kompaniya. Biz 10 yildan ortiq vaqt davomida sog'liqni saqlash muassasalarini zamonaviy uskunalar bilan ta'minlab kelmoqdamiz.</p>
          <ul className="about-list">
            <li>✅ Rasmiy kafolat va servis xizmati</li>
            <li>✅ Malakali mutaxassislar jamoasi</li>
            <li>✅ O'rnatish va o'qitish bepul</li>
            <li>✅ Butun O'zbekiston bo'ylab yetkazib berish</li>
          </ul>
        </div>
        <div className="about-stats">
          <div className="stat"><h3>500+</h3><p>Yetkazilgan uskuna</p></div>
          <div className="stat"><h3>150+</h3><p>Hamkor klinikalar</p></div>
          <div className="stat"><h3>10+</h3><p>Yillik tajriba</p></div>
          <div className="stat"><h3>24/7</h3><p>Texnik yordam</p></div>
        </div>
      </div>
    </section>
  );
}

/* ============ CONTACT ============ */
function Contact() {
  const [form, setForm] = useState({ name: '', phone: '', message: '' });
  const [sent, setSent] = useState(false);

  const handleChange = (e) => setForm({ ...form, [e.target.name]: e.target.value });

  const handleSubmit = (e) => {
    e.preventDefault();

    if (!form.name.trim() || !form.phone.trim() || !form.message.trim()) {
      setSent(false);
      return;
    }

    const smsText = `Ism: ${form.name.trim()}\nTelefon: ${form.phone.trim()}\nXabar: ${form.message.trim()}`;
    const smsLink = document.createElement('a');
    smsLink.href = `sms:+998945612161?body=${encodeURIComponent(smsText)}`;
    smsLink.click();
    setSent(true);
    setForm({ name: '', phone: '', message: '' });
    setTimeout(() => setSent(false), 7000);
  };

  return (
    <section className="contact" id="contact">
      <h2>Biz bilan bog'laning</h2>
      <p className="subtitle">Savollaringiz bormi? Yozing, tez javob beramiz!</p>
      <div className="contact-container">
        <div className="contact-info">
          <div className="info-item"><span>📞</span><div><h4>Telefon</h4><p>+998 94 561 21 61</p></div></div>
          <div className="info-item"><span>✉️</span><div><h4>Email</h4><p>info@medtech.uz</p></div></div>
          <div className="info-item"><span>📍</span><div><h4>Manzil</h4><p>Andijon.sh, Yuksalish kochasi 43-uy</p></div></div>
          <div className="info-item"><span>💬</span><div><h4>Telegram</h4><p><a href="https://t.me/Andijon_Ijara_uylari01" target="_blank" rel="noreferrer">@Andijon_Ijara_uylari01</a></p></div></div>
        </div>
        <form className="contact-form" onSubmit={handleSubmit}>
          <input type="text" name="name" placeholder="Ismingiz" value={form.name} onChange={handleChange} required />
          <input type="tel" name="phone" placeholder="Telefon raqamingiz" value={form.phone} onChange={handleChange} required />
          <textarea name="message" placeholder="Xabaringiz..." rows="5" value={form.message} onChange={handleChange} required></textarea>
          <button type="submit">Yuborish</button>
          {sent && <p className="success">✅ Telefoningizdagi SMS ilovasi ochilishi kerak. Ochilmasa, saytni telefonda oching.</p>}
        </form>
      </div>
    </section>
  );
}

        <div>

          <ul>
            <li><a href="https://t.me/Andijon_Ijara_uylari01" target="_blank" rel="noreferrer">Telegram</a></li>
            <li><a href="https://instagram.com/medtech_uz" target="_blank" rel="noreferrer">Instagram</a></li>
            <li><a href="https://facebook.com/medtechuz" target="_blank" rel="noreferrer">Facebook</a></li>
            <li><a href="https://youtube.com/@medtech_uz" target="_blank" rel="noreferrer">YouTube</a></li>
          </ul>
        </div>
      </div>
      <div className="footer-bottom">
        <p>© 2025 Rayol Med Texnika — Barcha huquqlar himoyalangan</p>
      </div>
    </footer>
  );
}

      <Navbar />

      <About />

}

</script>
